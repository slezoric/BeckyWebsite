<!--
  Netlify Forms detection stub.
  Netlify registers forms by scanning static HTML at deploy time. This bare
  form guarantees the "consultation" form and ALL its fields are detected,
  independent of how Next.js renders the interactive form on /contact/.

  IMPORTANT: every field on the real form must also appear here. A field
  missing from this list is silently dropped from submissions — the form
  still works, the answer just never reaches Becky.

  Do not delete.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <form name="consultation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>

      <!-- optional lead questions -->
      <select name="interest"></select>
      <select name="heard-about"></select>
      <select name="contact-method"></select>
      <select name="best-time"></select>
      <select name="timeframe"></select>

      <input name="bot-field" />
    </form>
  </body>
</html>
