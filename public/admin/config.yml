            hint: "One box per paragraph. Add or reorder as you like."
          - {
              name: approachesHeading,
              label: "Heading for 'how she works'",
              widget: string,
            }
          - {
              name: approachesIntro,
              label: "Intro for 'how she works'",
              widget: text,
            }
          - name: approaches
            label: "How she works"
