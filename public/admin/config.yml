# ---------------------------------------------------------------------------
#  Admin panel configuration
#
#  This tells the editor which parts of the website can be changed and what to
#  call them. Labels are written for someone who has never seen code.
#
#  Saving a change here commits it to GitHub, which makes Netlify rebuild the
#  site. Changes appear live about a minute or two after publishing.
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: slezoric/BeckyWebsite
  branch: main

# Changes are saved as a draft first, so nothing goes live until it is
# explicitly published. The draft also gets its own preview link.
publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

# Show the live preview pane beside the editor.
show_preview_links: true

collections:
  # -------------------------------------------------------------------------
  - name: "pages"
    label: "Website pages"
    label_singular: "page"
    description: "The wording on each page of the website."
    editor:
      preview: true
    files:
      # ---------------------------------------------------------------------
      - name: "home"
        label: "Home page"
        file: "src/content/home.json"
        description: "The first page visitors see."
        fields:
          - {
              name: heroEyebrow,
              label: "Small line above the headline",
              widget: string,
            }
          - {
              name: heroHeading,
              label: "Main headline",
              widget: text,
              hint: "The large handwritten line at the top of the page.",
            }
          - { name: heroIntro, label: "Opening paragraph", widget: text }
          - {
              name: heroPrimaryButton,
              label: "Main button text",
              widget: string,
            }
          - {
              name: heroSecondaryButton,
              label: "Second button text",
              widget: string,
            }
          - {
              name: quote,
              label: "Quote",
              widget: text,
              hint: "Shown in large handwriting across the middle of the page. Don't add quotation marks — they're added for you.",
            }
          - { name: quoteAttribution, label: "Quote signed by", widget: string }
          - {
              name: conditionsEyebrow,
              label: "Small line above 'what people come with'",
              widget: string,
            }
          - {
              name: conditionsHeading,
              label: "Heading for 'what people come with'",
              widget: string,
            }
          - name: conditions
            label: "What people come with"
            label_singular: "card"
            widget: list
            summary: "{{fields.title}}"
            hint: "The four cards. You can add, remove, or drag to reorder them."
            fields:
              - { name: title, label: "Card title", widget: string }
              - { name: body, label: "Card text", widget: text }
          - {
              name: conditionsLink,
              label: "Link text below the cards",
              widget: string,
            }
          - {
              name: journeyEyebrow,
              label: "Small line above 'the journey'",
              widget: string,
            }
          - {
              name: journeyHeading,
              label: "Heading for 'the journey'",
              widget: string,
            }
          - name: steps
            label: "The three steps"
            label_singular: "step"
            widget: list
            summary: "{{fields.number}} — {{fields.title}}"
            fields:
              - {
                  name: number,
                  label: "Step number",
                  widget: string,
                  hint: "For example 01, 02, 03.",
                }
              - { name: title, label: "Step title", widget: string }
              - { name: body, label: "Step description", widget: text }
          - {
              name: journeyButton,
              label: "Button below the steps",
              widget: string,
            }
          - {
              name: heroImage,
              label: "Background photograph at the top",
              widget: image,
            }
          - {
              name: heroImageAlt,
              label: "Description of that photograph",
              widget: string,
              hint: "Read aloud to visitors using a screen reader.",
            }
          - { name: quoteImage, label: "Photograph behind the quote", widget: image }
          - {
              name: quoteImageAlt,
              label: "Description of the quote photograph",
              widget: string,
            }
          - {
              name: conditionsImage,
              label: "Picture beside 'what people come with'",
              widget: image,
            }
          - {
              name: conditionsImageAlt,
              label: "Description of that picture",
              widget: string,
            }
          - {
              name: metaTitle,
              label: "Search-engine title (optional)",
              widget: string,
              required: false,
            }
          - {
              name: metaDescription,
              label: "Search-engine description (optional)",
              widget: text,
              required: false,
            }

      # ---------------------------------------------------------------------
      - name: "about"
        label: "Meet Becky page"
        file: "src/content/about.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - name: bio
            label: "About Becky"
            label_singular: "paragraph"
            widget: list
            field: { name: paragraph, label: "Paragraph", widget: text }
            hint: "One box per paragraph. Add or reorder as you like."
          - {
              name: approachesHeading,
              label: "Heading for 'how she works'",
              widget: string,
            }
          - {
              name: approachesIntro,
              label: "Intro for 'how she works'",
              widget: text,
            }
          - name: approaches
            label: "How she works"
            label_singular: "card"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Card title", widget: string }
              - { name: body, label: "Card text", widget: text }
          - {
              name: signature,
              label: "Signature at the end of your story",
              widget: string,
              required: false,
              hint: "Shown in the handwriting font, like signing a letter. Leave empty to hide it.",
            }
          - {
              name: credentialsHeading,
              label: "Credentials heading",
              widget: string,
            }
          - {
              name: credentialsEmpty,
              label: "Text shown when no credentials are listed",
              widget: text,
              hint: "Credentials themselves are added under 'Practice details'.",
            }
          - {
              name: credentialsButton,
              label: "Button under credentials",
              widget: string,
            }
          - {
              name: ctaHeading,
              label: "Heading of the closing invitation",
              widget: string,
            }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

      # ---------------------------------------------------------------------
      - name: "services"
        label: "What I Offer page"
        file: "src/content/services.json"
        description: "The ways you work with people, fees, and anything you sell."
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - { name: servicesHeading, label: "Heading above the list", widget: string, required: false }
          - name: services
            label: "Ways of working"
            label_singular: "offering"
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag to reorder. People usually read these top to bottom, so put the starting point first."
            fields:
              - { name: name, label: "Name of the offering", widget: string }
              - {
                  name: duration,
                  label: "How long it takes",
                  widget: string,
                  required: false,
                  hint: "For example 'About an hour'. Leave empty to hide.",
                }
              - {
                  name: note,
                  label: "Little highlighted label",
                  widget: string,
                  required: false,
                  hint: "Optional, e.g. 'Where everyone starts'. Leave empty to hide.",
                }
              - { name: body, label: "Description", widget: text }
          - { name: feesHeading, label: "Fees — heading", widget: string, required: false }
          - {
              name: feesBody,
              label: "Fees — what you want to say",
              widget: text,
              required: false,
              hint: "Leave empty to hide the whole fees section.",
            }
          - {
              name: productsHeading,
              label: "Shop — heading",
              widget: string,
              required: false,
            }
          - {
              name: productsIntro,
              label: "Shop — intro",
              widget: text,
              required: false,
            }
          - name: products
            label: "Things you sell"
            label_singular: "product"
            widget: list
            required: false
            summary: "{{fields.name}}"
            hint: "Leave this empty and the whole shop section stays hidden — better than showing 'coming soon'. Add one when you're ready."
            fields:
              - { name: name, label: "Product name", widget: string }
              - { name: price, label: "Price", widget: string, required: false }
              - { name: body, label: "Description", widget: text }
          - {
              name: ctaHeading,
              label: "Heading of the closing invitation",
              widget: string,
            }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - { name: metaDescription, label: "Search-engine description", widget: text }

      # ---------------------------------------------------------------------
      - name: "how-it-works"
        label: "How It Flows page"
        description: "Also holds what happens on the day, and the practical details — these used to be a separate page."
        file: "src/content/how-it-works.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - name: sections
            label: "Sections of the page"
            label_singular: "section"
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: "Section heading", widget: string }
              - name: paragraphs
                label: "Paragraphs"
                label_singular: "paragraph"
                widget: list
                field: { name: paragraph, label: "Paragraph", widget: text }
          - {
              name: journeyHeading,
              label: "What happens — heading",
              widget: string,
            }
          - {
              name: journeyIntro,
              label: "What happens — intro",
              widget: text,
            }
          - name: phases
            label: "Stages of the session"
            label_singular: "stage"
            widget: list
            summary: "{{fields.number}} — {{fields.title}}"
            fields:
              - { name: number, label: "Number", widget: string }
              - { name: title, label: "Stage title", widget: string }
              - { name: body, label: "Description", widget: text }
          - {
              name: logisticsHeading,
              label: "Practical details — heading",
              widget: string,
            }
          - {
              name: logisticsIntro,
              label: "Practical details — intro",
              widget: text,
            }
          - name: logistics
            label: "Practical details"
            label_singular: "card"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Card title", widget: string }
              - { name: body, label: "Card text", widget: text }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

      # ---------------------------------------------------------------------
      - name: "what-it-helps"
        label: "What It Helps page"
        file: "src/content/what-it-helps.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - {
              name: footnote,
              label: "Note below the table",
              widget: text,
            }
          - { name: footnoteLink, label: "Link text in that note", widget: string }
          - {
              name: ctaHeading,
              label: "Heading of the closing invitation",
              widget: string,
            }
          - name: gallery
            label: "Illustrations"
            label_singular: "illustration"
            widget: list
            summary: "{{fields.caption}}"
            hint: "Drag to reorder. Each needs a picture, a short title and a sentence or two."
            fields:
              - { name: image, label: "Picture", widget: image }
              - {
                  name: alt,
                  label: "Description of the picture",
                  widget: string,
                  hint: "Read aloud to visitors using a screen reader.",
                }
              - { name: caption, label: "Short title", widget: string }
              - { name: body, label: "Description", widget: text }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

      # ---------------------------------------------------------------------
      - name: "faq"
        label: "Questions page"
        description: "Also holds the 'is this for me' section — this used to be a separate page."
        file: "src/content/faq.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - name: items
            label: "Questions and answers"
            label_singular: "question"
            widget: list
            summary: "{{fields.question}}"
            hint: "Drag to reorder. The most common questions work best near the top."
            fields:
              - { name: question, label: "Question", widget: string }
              - { name: answer, label: "Answer", widget: text }
          - {
              name: eligibilityHeading,
              label: "Is this for me — heading",
              widget: string,
            }
          - {
              name: eligibilityIntro,
              label: "Is this for me — intro",
              widget: text,
            }
          - {
              name: crisisCalloutStrong,
              label: "Crisis box — bold opening words",
              widget: string,
              hint: "Shown in bold at the start. Usually ends with a comma.",
            }
          - {
              name: crisisCalloutBody,
              label: "Crisis box — the rest of the message",
              widget: text,
              hint: "Write it as one normal sentence. Type phone numbers straight into the text (988, 911, or a full number) and they become tappable on their own — you don't need to leave a gap for them.",
            }
          - { name: requirementsHeading, label: "'What you'll need' heading", widget: string }
          - { name: requirementsIntro, label: "'What you'll need' intro", widget: text }
          - name: requirements
            label: "What you'll need"
            label_singular: "item"
            widget: list
            field: { name: item, label: "Item", widget: text }
          - { name: treatFirstHeading, label: "'Things to settle first' heading", widget: string }
          - { name: treatFirstIntro, label: "'Things to settle first' intro", widget: text }
          - name: treatFirst
            label: "Things to settle first"
            label_singular: "item"
            widget: list
            field: { name: item, label: "Item", widget: string }
          - { name: notRightHeading, label: "'When this isn't right' heading", widget: string }
          - { name: notRightIntro, label: "'When this isn't right' intro", widget: text }
          - name: notRight
            label: "When this isn't the right path"
            label_singular: "item"
            widget: list
            field: { name: item, label: "Item", widget: string }
          - { name: notRightFootnote, label: "Note below that list", widget: text }
          - { name: closingHeading, label: "Closing heading", widget: string }
          - { name: closingBody, label: "Closing paragraph", widget: text }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

      # ---------------------------------------------------------------------
      - name: "contact"
        label: "Contact page"
        file: "src/content/contact.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - { name: labelName, label: "Form — name label", widget: string }
          - { name: placeholderName, label: "Form — name hint text", widget: string }
          - { name: labelEmail, label: "Form — email label", widget: string }
          - { name: placeholderEmail, label: "Form — email hint text", widget: string }
          - { name: labelPhone, label: "Form — phone label", widget: string }
          - {
              name: labelPhoneOptional,
              label: "Form — the word beside 'phone'",
              widget: string,
            }
          - { name: placeholderPhone, label: "Form — phone hint text", widget: string }
          - { name: labelMessage, label: "Form — message label", widget: string }
          - {
              name: placeholderMessage,
              label: "Form — message hint text",
              widget: string,
            }
          - { name: optionalHeading, label: "Optional questions — heading", widget: string }
          - { name: optionalIntro, label: "Optional questions — intro", widget: text }
          - { name: selectPlaceholder, label: "Dropdown placeholder text", widget: string }
          - { name: labelInterest, label: "'What brings you here' label", widget: string }
          - name: optionsInterest
            label: "'What brings you here' choices"
            label_singular: "choice"
            widget: list
            field: { name: choice, label: "Choice", widget: string }
          - { name: labelHeardAbout, label: "'How did you hear' label", widget: string }
          - name: optionsHeardAbout
            label: "'How did you hear' choices"
            label_singular: "choice"
            widget: list
            field: { name: choice, label: "Choice", widget: string }
          - { name: labelContactMethod, label: "'Best way to reach you' label", widget: string }
          - name: optionsContactMethod
            label: "'Best way to reach you' choices"
            label_singular: "choice"
            widget: list
            field: { name: choice, label: "Choice", widget: string }
          - { name: labelBestTime, label: "'Best time' label", widget: string }
          - name: optionsBestTime
            label: "'Best time' choices"
            label_singular: "choice"
            widget: list
            field: { name: choice, label: "Choice", widget: string }
          - { name: labelTimeframe, label: "'How soon' label", widget: string }
          - name: optionsTimeframe
            label: "'How soon' choices"
            label_singular: "choice"
            widget: list
            field: { name: choice, label: "Choice", widget: string }
          - {
              name: privacyNote,
              label: "Privacy note under the form",
              widget: text,
              hint: "This asks people not to send health details. Please keep that meaning.",
            }
          - { name: submitButton, label: "Send button text", widget: string }
          - { name: sidebarHeading, label: "Side panel heading", widget: string }
          - { name: labelLocation, label: "Side panel — 'Location' label", widget: string }
          - { name: labelServing, label: "Side panel — 'Serving' label", widget: string }
          - { name: bookingButton, label: "Online booking button text", widget: string }
          - { name: crisisHeading, label: "Crisis box heading", widget: string }
          - { name: crisisIntro, label: "Crisis box text", widget: text }
          - {
              name: successEyebrow,
              label: "Thank-you page — small line",
              widget: string,
            }
          - {
              name: successHeading,
              label: "Thank-you page — heading",
              widget: string,
            }
          - { name: successBody, label: "Thank-you page — message", widget: text }
          - {
              name: successPrimaryButton,
              label: "Thank-you page — first button",
              widget: string,
            }
          - {
              name: successSecondaryButton,
              label: "Thank-you page — second button",
              widget: string,
            }
          - {
              name: successCrisisNote,
              label: "Thank-you page — crisis note",
              widget: text,
            }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

  # -------------------------------------------------------------------------
  - name: "practice"
    label: "Practice details"
    description: "Your name, contact details, hours, and credentials. These appear all over the website."
    files:
      - name: "site"
        label: "Contact & practice details"
        file: "src/content/site.json"
        fields:
          - { name: name, label: "Practice name", widget: string }
          - { name: legalName, label: "Legal business name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - {
              name: discipline,
              label: "What you do",
              widget: string,
              hint: "Appears in the browser tab and in Google results.",
            }
          - { name: practitioner, label: "Your name", widget: string }
          - {
              name: practitionerTitle,
              label: "Letters after your name",
              widget: string,
              required: false,
              hint: "For example LCSW. Leave empty if not needed.",
            }
          - { name: email, label: "Email address", widget: string }
          - {
              name: phone,
              label: "Phone number (as shown)",
              widget: string,
              hint: "For example (515) 329-5083",
            }
          - {
              name: responseTime,
              label: "How soon you usually reply",
              widget: string,
              hint: "Finishes the sentence 'We typically respond ___.'",
            }
          - {
              name: inPerson,
              label: "Do you see people in person?",
              widget: boolean,
              hint: "Turn off for online-only, and the address will be hidden.",
            }
          - name: address
            label: "Address"
            widget: object
            collapsed: true
            fields:
              - { name: line1, label: "Street address", widget: string, required: false }
              - { name: city, label: "Town or city", widget: string, required: false }
              - { name: state, label: "State", widget: string, required: false }
              - { name: zip, label: "ZIP code", widget: string, required: false }
          - {
              name: serviceArea,
              label: "Area you serve",
              widget: string,
              required: false,
            }
          - name: hours
            label: "Opening hours"
            label_singular: "row"
            widget: list
            summary: "{{fields.day}} — {{fields.value}}"
            fields:
              - { name: day, label: "Day or days", widget: string }
              - {
                  name: value,
                  label: "Hours",
                  widget: string,
                  hint: "For example 'By appointment' or 'Closed'.",
                }
          - name: credentials
            label: "Credentials and training"
            label_singular: "credential"
            widget: list
            required: false
            field: { name: credential, label: "Credential", widget: string }
            hint: "Shown on the Meet Becky page. Leave empty to hide the list."
          - {
              name: bookingUrl,
              label: "Online booking link",
              widget: string,
              required: false,
              hint: "Paste a scheduling link to add a 'Book online' button. Leave empty to use the form only.",
            }
          - name: social
            label: "Social links"
            widget: object
            collapsed: true
            fields:
              - { name: instagram, label: "Instagram", widget: string, required: false }
              - { name: facebook, label: "Facebook", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn", widget: string, required: false }
          - {
              name: portrait,
              label: "Your photograph",
              widget: image,
              required: false,
            }
          - {
              name: portraitAlt,
              label: "Description of the photograph",
              widget: string,
              hint: "Read aloud to visitors who use a screen reader. Describe what's in the picture.",
            }
          - name: music
            label: "Background music"
            widget: object
            collapsed: true
            fields:
              - {
                  name: file,
                  label: "Music file",
                  widget: file,
                  required: false,
                  hint: "Upload an MP3. Leave empty and the play button is hidden entirely. Use royalty-free music only, and fill in the credit below — most licences require it.",
                }
              - { name: title, label: "Track name", widget: string, required: false }
              - { name: artist, label: "Artist", widget: string, required: false }
              - {
                  name: sourceUrl,
                  label: "Link to where you got it",
                  widget: string,
                  required: false,
                  hint: "Many licences require a link back to the source.",
                }
              - {
                  name: licence,
                  label: "Licence",
                  widget: string,
                  required: false,
                  hint: "For example 'Pixabay Content Licence' or 'CC BY 4.0'.",
                }
              - {
                  name: volume,
                  label: "Volume",
                  widget: number,
                  value_type: float,
                  min: 0,
                  max: 1,
                  step: 0.05,
                  hint: "0 is silent, 1 is full. 0.35 is a gentle background level.",
                }
              - { name: playLabel, label: "Play button text", widget: string }
              - { name: pauseLabel, label: "Pause button text", widget: string }
          - {
              name: url,
              label: "Website address",
              widget: string,
              hint: "The full address of the live site, used by search engines.",
            }
          - {
              name: description,
              label: "Description for search engines",
              widget: text,
            }

      - name: "navigation"
        label: "Menu, footer & crisis note"
        file: "src/content/navigation.json"
        fields:
          - name: items
            label: "Menu links"
            label_singular: "link"
            widget: list
            summary: "{{fields.label}}"
            hint: "Drag to reorder the menu. Please don't change the web address unless a page has moved."
            fields:
              - { name: label, label: "Menu wording", widget: string }
              - { name: href, label: "Web address", widget: string }
          - {
              name: headerButton,
              label: "Button at the top of every page",
              widget: string,
            }
          - {
              name: footerBlurb,
              label: "Short line in the footer",
              widget: text,
            }
          - {
              name: crisisNote,
              label: "Crisis note shown on every page",
              widget: text,
              hint: "Please keep the 988 number and the point that this site isn't a crisis service.",
            }
          - {
              name: legalFootnote,
              label: "Legal small print in the footer",
              widget: text,
              hint: "Reviewed by your attorney — please check with them before changing.",
            }

  # -------------------------------------------------------------------------
  - name: "legal"
    label: "Legal pages"
    description: "Consent, disclaimer, privacy and terms. Please have changes here reviewed by your attorney before publishing."
    files:
