                hint: "This sets the colour of the little badge."
              - { name: note, label: "What we know so far", widget: text }
          - {
              name: footnote,
              label: "Note below the table",
              widget: text,
            }
          - { name: footnoteLink, label: "Link text in that note", widget: string }
          - {
              name: ctaHeading,
              label: "Heading of the closing invitation",
              widget: string,
            }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

