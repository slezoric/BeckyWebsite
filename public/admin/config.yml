            fields:
              - { name: name, label: "What someone might be carrying", widget: string }
              - name: strength
                label: "How strong is the evidence?"
                widget: select
                options:
                  - "Strong"
                  - "Moderate to Strong"
                  - "Moderate"
                  - "Moderate but preliminary"
