            }
          - {
              name: factsCardHeading,
              label: "Quick facts box — heading",
              widget: string,
            }
          - name: facts
            label: "Quick facts"
            label_singular: "fact"
            widget: list
            field: { name: fact, label: "Fact", widget: string }
          - {
              name: honestNote,
              label: "Honest note (the highlighted box)",
              widget: text,
            }
          - { name: metaTitle, label: "Search-engine title", widget: string }
          - {
              name: metaDescription,
              label: "Search-engine description",
              widget: text,
            }

      # ---------------------------------------------------------------------
      - name: "what-it-helps"
        label: "What It Helps page"
        file: "src/content/what-it-helps.json"
        fields:
          - { name: eyebrow, label: "Small line above the heading", widget: string }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Opening paragraph", widget: text }
          - {
              name: tableHeadCondition,
              label: "Table column 1 heading",
              widget: string,
