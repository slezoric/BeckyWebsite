  # -------------------------------------------------------------------------
  - name: "practice"
    label: "Practice details"
    description: "Your name, contact details, hours, and credentials. These appear all over the website."
    files:
      - name: "site"
        label: "Contact & practice details"
        file: "src/content/site.json"
        fields:
          - { name: name, label: "Practice name", widget: string }
          - { name: legalName, label: "Legal business name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - {
              name: discipline,
              label: "What you do",
              widget: string,
              hint: "Appears in the browser tab and in Google results.",
            }
          - { name: practitioner, label: "Your name", widget: string }
          - {
              name: practitionerTitle,
              label: "Letters after your name",
              widget: string,
              required: false,
              hint: "For example LCSW. Leave empty if not needed.",
            }
          - { name: email, label: "Email address", widget: string }
          - {
              name: phone,
              label: "Phone number (as shown)",
              widget: string,
              hint: "For example (515) 329-5083",
            }
          - {
              name: phoneHref,
              label: "Phone number (for tapping)",
              widget: string,
              hint: "Digits only, keeping the 'tel:+1' at the start. For example tel:+15153295083",
            }
          - {
              name: responseTime,
              label: "How soon you usually reply",
              widget: string,
              hint: "Finishes the sentence 'We typically respond ___.'",
            }
          - {
              name: inPerson,
              label: "Do you see people in person?",
              widget: boolean,
              hint: "Turn off for online-only, and the address will be hidden.",
            }
          - name: address
            label: "Address"
            widget: object
            collapsed: true
            fields:
              - { name: line1, label: "Street address", widget: string, required: false }
              - { name: city, label: "Town or city", widget: string, required: false }
              - { name: state, label: "State", widget: string, required: false }
              - { name: zip, label: "ZIP code", widget: string, required: false }
          - {
              name: serviceArea,
              label: "Area you serve",
              widget: string,
              required: false,
            }
          - name: hours
            label: "Opening hours"
            label_singular: "row"
            widget: list
            summary: "{{fields.day}} — {{fields.value}}"
            fields:
              - { name: day, label: "Day or days", widget: string }
              - {
                  name: value,
                  label: "Hours",
                  widget: string,
                  hint: "For example 'By appointment' or 'Closed'.",
                }
          - name: credentials
            label: "Credentials and training"
            label_singular: "credential"
            widget: list
            required: false
            field: { name: credential, label: "Credential", widget: string }
            hint: "Shown on the Meet Becky page. Leave empty to hide the list."
          - {
              name: bookingUrl,
              label: "Online booking link",
              widget: string,
              required: false,
              hint: "Paste a scheduling link to add a 'Book online' button. Leave empty to use the form only.",
            }
          - name: social
            label: "Social links"
            widget: object
            collapsed: true
            fields:
              - { name: instagram, label: "Instagram", widget: string, required: false }
              - { name: facebook, label: "Facebook", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn", widget: string, required: false }
          - {
              name: portrait,
              label: "Your photograph",
              widget: image,
              required: false,
            }
          - {
              name: portraitAlt,
              label: "Description of the photograph",
              widget: string,
              hint: "Read aloud to visitors who use a screen reader. Describe what's in the picture.",
            }
          - {
              name: url,
              label: "Website address",
              widget: string,
              hint: "The full address of the live site, used by search engines.",
            }
          - {
              name: description,
              label: "Description for search engines",
              widget: text,
            }

      - name: "navigation"
        label: "Menu, footer & crisis note"
        file: "src/content/navigation.json"
        fields:
          - name: items
            label: "Menu links"
            label_singular: "link"
            widget: list
            summary: "{{fields.label}}"
            hint: "Drag to reorder the menu. Please don't change the web address unless a page has moved."
            fields:
              - { name: label, label: "Menu wording", widget: string }
              - { name: href, label: "Web address", widget: string }
          - {
              name: headerButton,
              label: "Button at the top of every page",
              widget: string,
            }
          - {
              name: footerBlurb,
              label: "Short line in the footer",
              widget: text,
            }
          - {
              name: crisisNote,
              label: "Crisis note shown on every page",
              widget: text,
              hint: "Please keep the 988 number and the point that this site isn't a crisis service.",
            }
          - {
              name: legalFootnote,
              label: "Legal small print in the footer",
              widget: text,
              hint: "Reviewed by your attorney — please check with them before changing.",
            }

