# Netlify deploy config for the A World Within static site.
# Next.js `output: 'export'` produces a fully static site in `out/`.
#
# Note there is deliberately no @netlify/plugin-nextjs. That plugin exists to
# run Next's server — SSR, ISR, middleware — on Netlify Functions. Nothing
# here needs a server, so it would add serverless machinery for a site made of
# plain files. If Netlify ever auto-detects Next and enables it, remove it.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Security headers for all routes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Build assets carry a content hash in the filename, so they can be cached
# forever — a change produces a different filename.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pictures were revalidating on every single page view, which is a round trip
# per image per visit for files that rarely change.
#
# One day, NOT a year, and deliberately not `immutable`. Becky uploads images
# through the admin panel into this same folder, and a replacement keeps its
# filename — so anything longer would leave visitors looking at the old
# picture with no way to force a refresh. A day is the most staleness worth
# trading for the saving.
#
# The share card is exempt from that worry either way: its URL carries a
# content hash, so a new image is a new address.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The music is 2.1MB and was being revalidated on every visit. It is a single
# fixed track, so a week is safe and saves anyone who plays it repeatedly.
[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# The editing panel must never be cached. Becky's field definitions live in
# config.yml, and a stale copy would show her an editor that no longer matches
# the site — with fields that have been removed, or missing ones that were
# added.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

# ---------------------------------------------------------------------------
# Lighthouse, run against each deploy.
#
# Declared here rather than in the Netlify UI so the thresholds live in
# version control and change through review like anything else. If it is also
# installed through the UI, remove it there — this file wins, and having two
# records of the same thing invites them to disagree.
#
# The thresholds below are set from a measured baseline of the live site
# rather than picked out of the air:
#
#     page        perf  a11y  best   seo
#     home          91   100   100   100
#     about         95   100   100   100
#     contact       98   100   100   100
#     faq           98   100   100   100
#
# Quality bars sit just under a perfect score, so a genuine regression fails
# but ordinary noise does not. Performance is set well below its 91 because
# it is the one metric that swings with the machine the build lands on;
# holding it to 0.9 would fail builds for reasons no one changed. It is there
# to catch something breaking badly, not to chase a number.
#
# Worth remembering: Becky publishing a wording change triggers a build. If a
# threshold fails, her edit does not go live — and she will not know why.
# Watch the first few runs before tightening any of these.
# ---------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

    [plugins.inputs.thresholds]
      performance = 0.7
      accessibility = 0.95
      best-practices = 0.95
      seo = 0.95

  # The pages that matter: the front door, the one people read longest, and
  # the one that has to work for an enquiry to arrive at all.
  [[plugins.inputs.audits]]
    path = "index.html"

  [[plugins.inputs.audits]]
    path = "faq/index.html"

  [[plugins.inputs.audits]]
    path = "contact/index.html"
